# Runs the tests for every pull request and every push to main. Two jobs side by side: the worker
# suites finish in a few minutes; the browser suites (a real TiddlyWiki in Chromium) take longer.
# Every suite runs to the end (tools/run-suites.mjs), and a job that fails, or is cancelled by its
# timeout, uploads test-results/ — each suite's log and, for a browser suite that failed, the
# requests its pages made and a Playwright trace of each browser context — so a failure on the
# runner can be read rather than guessed at (development 6, design 2.24). A first job reads what the
# run is about: for a change that touches the docs alone, the browser job is skipped and the worker
# job runs the repository suite in place of its suites, a minute instead of twelve. The two checks
# the ruleset on main requires keep their names: a job skipped by its condition reports success,
# where a workflow skipped by a path filter would leave them waiting.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token gets no more than reading the repository: the jobs push nothing
permissions:
  contents: read

# One run per commit: a newer commit on the same branch supersedes an older one's run, and a re-run
# of a commit's run (from the PR's Checks tab) never cancels another commit's — keying on the branch
# made a re-run of an old commit cancel the current commit's run, and the other way round.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The files this run is about: a pull request's against its base, a push's against the commit
      # before it. Anything outside the docs (docs/, the README, the changelog, CONTRIBUTING, AGENTS,
      # CLAUDE) is code; a diff that can't be read (a first push) runs everything.
      - id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$files" ]; then
            outside=$(printf '%s\n' "$files" | grep -cvE '^(docs/.*|README\.md|CHANGELOG\.md|CONTRIBUTING\.md|AGENTS\.md|CLAUDE\.md)$' || true)
            [ "$outside" = 0 ] && code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"
          printf '%s\n' "$files"

  worker:
    name: Worker tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # worker.js is committed: it must be what src/ builds
      - run: npm run check:build
      # The worker suites when code changed; for a change to the docs alone, the repository suite
      # (every link and section reference), the one check such a change needs
      - run: npm run test:fast
        if: needs.changes.outputs.code == 'true'
      - run: npm run test:repository
        if: needs.changes.outputs.code != 'true'
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: worker-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
