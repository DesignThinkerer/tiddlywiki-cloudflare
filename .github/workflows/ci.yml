# Runs the tests for every pull request and every push to main. Two jobs side by side: the worker
# suites finish in a few minutes; the browser suites (a real TiddlyWiki in Chromium) take longer.
# Every suite runs to the end (tools/run-suites.mjs), and a failed job uploads test-results/ — each
# suite's log and, for a browser suite that failed, the requests its pages made and a Playwright
# trace of each browser context — so a failure on the runner can be read rather than guessed at
# (README 6, design 2.24).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token gets no more than reading the repository: the jobs push nothing
permissions:
  contents: read

# One run per commit: a newer commit on the same branch supersedes an older one's run, and a re-run
# of a commit's run (from the PR's Checks tab) never cancels another commit's — keying on the branch
# made a re-run of an old commit cancel the current commit's run, and the other way round.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # worker.js is committed: it must be what src/ builds
      - run: npm run check:build
      - run: npm run test:fast
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: worker-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
