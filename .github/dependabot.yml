# Dependency updates as pull requests, weekly: the npm packages (one PR per update, the tests run on
# it) and the Actions the workflows use. A release is proposed only once it has been out for a few
# days (cooldown: for an npm package three for a patch, a week for a minor, a month for a major; a
# week for an Action, whose versions are tags and take one number): a compromised release is usually
# found and pulled within days, and Workers Builds installs the dev dependencies with the credentials
# that deploy the worker. A fix for a known vulnerability isn't delayed by it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # The wiki engine is bumped by hand, in a pull request of its own (operating 3.3):
      # a new TiddlyWiki is checked against the browser modules and the list filter first, and
      # shipping it is what every user's "Update the engine" button then offers
      - dependency-name: tiddlywiki
    groups:
      # ESLint, its recommended rules and the globals it reads move together: a version apart, they
      # don't install (@eslint/js 10 with eslint 9) or lint with the wrong rule set
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - globals
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
